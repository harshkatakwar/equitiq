# Render.com deployment blueprint for EquitIQ
# https://render.com/docs/blueprint-spec

databases:
  - name: equitiq-postgres
    databaseName: researchos
    user: researchos
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: equitiq-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    healthCheckPath: /health
    envVars:
      # Render gives a postgres:// URL; we expose both variants manually below.
      # Set DATABASE_URL in the dashboard with the asyncpg variant:
      #   postgresql+asyncpg://user:pass@host/db
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: equitiq-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATA_MODE
        value: demo
      - key: AI_PROVIDER
        value: mock
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "https://equitiq-web.onrender.com,http://localhost:3000"
      - key: REDIS_URL
        value: "redis://localhost:6379/0"
      - key: CELERY_BROKER_URL
        value: "redis://localhost:6379/1"
      - key: S3_ENDPOINT_URL
        value: "http://localhost:9000"
      - key: S3_ACCESS_KEY
        value: "minioadmin"
      - key: S3_SECRET_KEY
        value: "minioadmin"
      - key: S3_BUCKET_NAME
        value: "researchos-documents"
    startCommand: >-
      sh -c "
        export DATABASE_URL=\"${DATABASE_URL_SYNC/postgresql:\/\//postgresql+asyncpg:\/\/}\" &&
        alembic upgrade head &&
        uvicorn src.main:app --host 0.0.0.0 --port ${PORT:-8000}
      "
